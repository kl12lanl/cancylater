<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вертикальный калькулятор</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }

        /* Контейнер калькулятора (вытянут в столбик) */
        .calculator {
            width: 320px;
            background-color: #17171c;
            padding: 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Экран калькулятора */
        .display {
            width: 100%;
            height: 80px;
            background-color: transparent;
            border: none;
            color: #ffffff;
            text-align: right;
            font-size: 2.5rem;
            padding: 10px;
            margin-bottom: 20px;
            outline: none;
        }

        /* Сетка для кнопок */
        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        /* Общий стиль для всех кнопок */
        button {
            padding: 20px;
            font-size: 1.5rem;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            background-color: #2e2f38;
            color: #ffffff;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Стиль для операторов (+, -, *, /) */
        .operator {
            background-color: #ff9f0a;
            color: #ffffff;
        }

        .operator:hover {
            background-color: #e08b09;
        }

        /* Стиль для кнопки очистки (C) */
        .clear {
            background-color: #4e505f;
        }

        .clear:hover {
            background-color: #3e404c;
        }

        /* Стиль для кнопки «равно» */
        .equal {
            background-color: #ff9f0a;
            grid-column: span 2; /* Растягиваем на 2 колонки для удобства */
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- Экран вывода -->
        <input type="text" class="display" id="result" readonly value="0">
        
        <!-- Кнопки в столбик/ряд -->
        <div class="buttons">
            <button class="clear" onclick="clearScreen()">C</button>
            <button class="clear" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="appendValue('/')">/</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('-')">-</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('.')">.</button>

            <button onclick="appendValue('0')">0</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('result');

        // Добавление символа на экран
        function appendValue(value) {
            if (display.value === '0' && value !== '.') {
                display.value = value;
            } else {
                display.value += value;
            }
        }

        // Очистить весь экран
        function clearScreen() {
            display.value = '0';
        }

        // Удалить последний символ
        function deleteLast() {
            if (display.value.length > 1) {
                display.value = display.value.slice(0, -1);
            } else {
                display.value = '0';
            }
        }

        // Вычисление результата
        function calculate() {
            try {
                // eval выполняет математическое выражение из строки
                let result = eval(display.value);
                
                // Округление, чтобы избежать проблем с плавающей точкой (например, 0.1 + 0.2)
                display.value = Number(result.toFixed(8)).toString();
            } catch (error) {
                display.value = 'Ошибка';
            }
        }
    </script>
</body>
</html>
